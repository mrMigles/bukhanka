name: Web export and GHCR
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Godot and single-threaded Web templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$RUNNER_TEMP/godot" builds/tooling
          cd "$RUNNER_TEMP/godot"
          curl -fLsS --retry 3 -O "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 -O "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fLsS --retry 3 -O "$base/SHA512-SUMS.txt"
          grep -E "Godot_v${GODOT_VERSION}-stable_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          unzip -j -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" 'templates/web_nothreads_*.zip' -d "$GITHUB_WORKSPACE/builds/tooling"
      - name: Import and export with project settings
        shell: pwsh
        run: ./build-web.ps1 -Godot $env:GODOT
      - name: Headless expedition regression
        shell: bash
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/bukhanka-test"
          "$GODOT" --headless --path . --editor --import --quit
          "$GODOT" --headless --path . --script res://tests/expedition.gd -- --test-mode
      - uses: actions/upload-artifact@v4
        with:
          name: bukhanka-web
          path: builds/Web/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
