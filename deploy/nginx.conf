map $uri $bukhanka_cache_control {
    default "no-store";
    "~^/(game-[0-9a-f]{12}\\.|(?:pwa-update|loading)-[0-9a-f]{12}\\.js$|poster-[0-9a-f]{12}\\.webp$)" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $bukhanka_cache_control always;
    gzip on;
    gzip_static on;
    # Caddy/Portainer sends Via; nginx otherwise disables gzip for that request.
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/javascript application/wasm application/octet-stream text/css application/json;
    location / {
        try_files $uri $uri/ =404;
    }
}
